<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulario Placas 100x100 - TELGO FACTORY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#061827;
font-family:Arial, Helvetica, sans-serif;
padding:30px 16px 60px;
display:flex;
justify-content:center;
}

.formulario{
width:100%;
max-width:560px;
background:white;
border-radius:20px;
padding:28px;
box-shadow:0 14px 30px rgba(0,0,0,0.45);
}

h1{
text-align:center;
font-size:30px;
color:#062033;
margin-bottom:24px;
}

label{
display:block;
margin-top:16px;
margin-bottom:6px;
font-size:15px;
font-weight:bold;
color:#062033;
}

input, textarea{
width:100%;
padding:14px;
border:1px solid #c7d2df;
border-radius:10px;
font-size:16px;
font-family:Arial, Helvetica, sans-serif;
}

textarea{
min-height:110px;
resize:vertical;
}

.opcion{
display:flex;
gap:10px;
align-items:center;
margin-top:12px;
font-weight:bold;
color:#062033;
}

.opcion input{
width:auto;
}

.texto-ayuda{
font-size:13px;
color:#5a6a7b;
margin-top:5px;
line-height:1.4;
}

.separador{
margin-top:28px;
padding-top:22px;
border-top:1px solid #d9e1ea;
font-size:18px;
font-weight:bold;
color:#062033;
}

.link-medida{
display:block;
margin-top:18px;
background:#0b2238;
color:white;
text-align:center;
padding:16px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
}

.boton{
width:100%;
height:74px;
margin-top:30px;
border:none;
border-radius:14px;
background:#159447;
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="formulario">

<h1>Placas lisas 100 x 100</h1>

<div class="separador">Densidad</div>

<label class="opcion">
<input type="radio" name="densidad" value="STD">
STD
</label>

<label class="opcion">
<input type="radio" name="densidad" value="20 kg">
20 kg
</label>

<label class="opcion">
<input type="radio" name="densidad" value="30 kg">
30 kg
</label>

<label class="opcion">
<input type="radio" name="densidad" value="No sé qué densidad necesito">
No sé qué densidad necesito
</label>

<div class="texto-ayuda">
Si no sabés qué densidad necesitás, completá observaciones y te asesoramos.
</div>

<a class="link-medida" href="formulario-placas-a-medida.html">
Necesito placas a medida
</a>

<label>Espesor</label>
<input type="text" id="espesor" placeholder="Ej: 5 cm">

<label>Cantidad de placas</label>
<input type="text" id="cantidad" placeholder="Ej: 20 placas">

<label>Observaciones</label>
<textarea id="observaciones" placeholder="Indicá cualquier detalle adicional de la consulta."></textarea>

<div class="separador">
Si querés cotizar con envío, completá estos datos
</div>

<label>Calle</label>
<input type="text" id="calle" placeholder="Ej: Av. San Martín 1234">

<label>Entre calles</label>
<input type="text" id="entre" placeholder="Ej: Mitre y Belgrano">

<label>Localidad</label>
<input type="text" id="localidad" placeholder="Ej: Lanús">

<button class="boton" onclick="enviarWhatsApp()">
SOLICITAR COTIZACIÓN
</button>

</div>

<script>
function enviarWhatsApp(){

const densidadSeleccionada = document.querySelector('input[name="densidad"]:checked');
const densidad = densidadSeleccionada ? densidadSeleccionada.value : "";

const espesor = document.getElementById("espesor").value;
const cantidad = document.getElementById("cantidad").value;
const observaciones = document.getElementById("observaciones").value;
const calle = document.getElementById("calle").value;
const entre = document.getElementById("entre").value;
const localidad = document.getElementById("localidad").value;

const mensaje =
`Hola, quiero solicitar cotización de placas lisas 100 x 100.

Densidad:
${densidad}

Espesor:
${espesor}

Cantidad de placas:
${cantidad}

Observaciones:
${observaciones}

Datos para envío:

Calle:
${calle}

Entre calles:
${entre}

Localidad:
${localidad}`;

const url =
"https://wa.me/541132181527?text=" +
encodeURIComponent(mensaje);

window.open(url, "_blank");

}
</script>

</body>
</html>

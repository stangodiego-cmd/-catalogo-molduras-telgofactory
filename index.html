<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELGO FACTORY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#061827;
  color:white;
}

.hero{
  min-height:100vh;
  background-image:url("fondo azul web.png");
  background-size:cover;
  background-position:center;
  padding:42px;
  display:grid;
  grid-template-columns:40% 60%;
  gap:28px;
  align-items:center;
}

.izquierda{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.logo-grande{
  width:62%;
  max-width:390px;
  margin-bottom:28px;
}

.bloque-texto{
  width:100%;
  max-width:660px;
  margin-bottom:30px;
}

.menu{
  width:70%;
  max-width:430px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.boton{
  width:100%;
  height:62px;
  border:none;
  border-radius:12px;
  background:rgba(8,26,43,0.95);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
}

.productos{
  position:relative;
}

.submenu{
  display:none;
  flex-direction:column;
  gap:8px;
  margin-top:8px;
}

.productos:hover .submenu{
  display:flex;
}

.submenu a{
  background:white;
  color:#062033;
  padding:14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}

.derecha{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  display:block;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,0.38);
}

.card img{
  width:100%;
  display:block;
}

.logo-chico{
  position:fixed;
  left:28px;
  bottom:24px;
  width:72px;
  z-index:20;
}

.whatsapp{
  position:fixed;
  right:24px;
  bottom:24px;
  width:68px;
  height:68px;
  border-radius:50%;
  background:#25D366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  text-decoration:none;
  z-index:30;
  box-shadow:0 8px 22px rgba(0,0,0,0.42);
}

a{text-decoration:none}

@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
    padding:22px;
  }

  .logo-grande{
    width:72%;
  }

  .bloque-texto{
    width:100%;
  }

  .menu{
    width:100%;
  }

  .derecha{
    grid-template-columns:1fr;
  }

  .logo-chico{
    width:54px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="izquierda">

    <img class="logo-grande" src="logo grande web.jpeg" alt="Logo TELGO FACTORY">

    <img class="bloque-texto" src="bloque de texto web.png" alt="TELGO FACTORY Especialistas en productos EPS">

    <div class="menu">

      <div class="productos">
        <button class="boton">PRODUCTOS</button>

        <div class="submenu">
          <a href="bolsas.html">BOLSAS</a>
          <a href="placas-100x100.html">PLACAS LISAS 100 x 100</a>
          <a href="placas-a-medida.html">PLACAS LISAS A MEDIDA</a>
          <a href="molduras.html">MOLDURAS</a>
        </div>
      </div>

      <a class="boton" href="reciclado.html">RECICLADO EPS</a>

      <a class="boton" href="https://wa.me/541132181527" target="_blank">CONTACTO</a>

    </div>

  </div>

  <div class="derecha">

    <a class="card" href="bolsas.html">
      <img src="bolsa web.png" alt="Bolsas">
    </a>

    <a class="card" href="molduras.html">
      <img src="molder web.png" alt="Molduras">
    </a>

    <a class="card" href="placas-100x100.html">
      <img src="placa web.png" alt="Placas">
    </a>

    <a class="card" href="reciclado.html">
      <img src="reciclar web.png" alt="Reciclado EPS">
    </a>

  </div>

</section>

<img class="logo-chico" src="logo chico web.jpeg" alt="TF">

<a class="whatsapp" href="https://wa.me/541132181527" target="_blank">☎</a>

</body>
</html>

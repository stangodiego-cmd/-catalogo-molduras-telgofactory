body{

  overflow-x:hidden;
}

.portada{
  width:100%;
  min-height:100vh;
  background-image:url("portada.png");
  background-size:cover;
  background-position:center;
  position:relative;
}

.menu{
  position:absolute;
  left:22%;
  top:66%;

  max-width:430px;
  min-width:260px;

  flex-direction:column;

.boton{
  width:100%;
  height:64px;
  border:none;
  border-radius:12px;
  background:rgba(8,26,43,0.96);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.45);
}

.productos{
  position:relative;
}

.submenu{
  display:none;
  position:absolute;
  left:0;
  bottom:76px;
  width:100%;
  flex-direction:column;
  gap:10px;
}

.productos:hover .submenu{
  display:flex;
}

.submenu a{
  text-decoration:none;
}

.submenu button{
  width:100%;
  min-height:58px;
  border:none;
  border-radius:12px;
  background:white;
  color:#062033;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  padding:10px;
  box-shadow:0 8px 18px rgba(0,0,0,0.28);
}

a{text-decoration:none}

.whatsapp{
  position:fixed;
  right:24px;
  bottom:24px;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#25D366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
  z-index:1000;
  box-shadow:0 10px 24px rgba(0,0,0,0.4);
}

@media(max-width:900px){
  .menu{
    left:8%;
    right:8%;
    top:auto;
    bottom:90px;
    width:auto;
    max-width:none;
  }

  .boton{
    height:58px;
    font-size:17px;
  }

  .submenu{
    bottom:70px;
  }
}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TELGO FACTORY</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#061827;
      overflow-x:hidden;
    }

    .portada{

      width:100%;
      height:100vh;

      background-image:url("portada.png");
      background-size:cover;
      background-position:center;

      position:relative;

    }

    .menu{

      position:absolute;

      left:400px;
      bottom:300px;

      width:430px;

      display:flex;
      flex-direction:column;

      gap:18px;

      z-index:10;

    }

    .boton{

      width:100%;
      height:78px;

      border:none;
      border-radius:16px;

      background:rgba(8,26,43,0.96);

      color:white;

      font-size:26px;
      font-weight:bold;

      cursor:pointer;

      box-shadow:0 10px 25px rgba(0,0,0,0.45);

    }

    .productos{

      position:relative;

    }

    .submenu{

      display:none;

      flex-direction:column;

      gap:10px;

      margin-bottom:10px;

    }

    .productos:hover .submenu{

      display:flex;

    }

    .submenu a{

      text-decoration:none;

    }

    .submenu button{

      width:100%;
      min-height:64px;

      border:none;
      border-radius:14px;

      background:white;

      color:#062033;

      font-size:20px;
      font-weight:bold;

      cursor:pointer;

      padding:10px;

      box-shadow:0 8px 18px rgba(0,0,0,0.28);

    }

    a{

      text-decoration:none;

    }

    .whatsapp{

      position:fixed;

      right:24px;
      bottom:24px;

      width:72px;
      height:72px;

      border-radius:50%;

      background:#25D366;

      color:white;

      text-decoration:none;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:38px;
      font-weight:bold;

      z-index:1000;

      box-shadow:0 10px 24px rgba(0,0,0,0.4);

    }

    @media(max-width:900px){

      .portada{

        min-height:100vh;

        background-position:center;

      }

      .menu{

        left:22px;
        right:22px;

        bottom:90px;

        width:auto;

      }

      .boton{

        height:64px;

        font-size:22px;

      }

      .submenu button{

        min-height:58px;

        font-size:18px;

      }

    }

  </style>

</head>

<body>

  <section class="portada">

    <div class="menu">

      <div class="productos">

        <div class="submenu">

          <a href="bolsas.html">
            <button>BOLSAS</button>
          </a>

          <a href="placas-100x100.html">
            <button>PLACAS LISAS 100 x 100</button>
          </a>

          <a href="placas-a-medida.html">
            <button>PLACAS LISAS A MEDIDA</button>
          </a>

          <a href="molduras.html">
            <button>MOLDURAS</button>
          </a>

        </div>

        <button class="boton">
          PRODUCTOS
        </button>

      </div>

      <a href="reciclado.html">

        <button class="boton">
          RECICLADO EPS
        </button>

      </a>

      <a href="https://wa.me/541132181527" target="_blank">

        <button class="boton">
          CONTACTO
        </button>

      </a>

    </div>

  </section>

  <a class="whatsapp" href="https://wa.me/541132181527" target="_blank">
    ☎
  </a>

</body>

</html>
